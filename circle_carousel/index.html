<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gather Carousel - Fixed Motion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        :root {
            --card-w: 200px;
            --card-h: 300px;
            --radius: 750px; /* The distance to the center of the circle */
        }

        body, html {
            margin: 0;
            background: var(--bg-color);
            color: white;
            font-family: sans-serif;
            height: 100vh;
            overflow: hidden;
            /* The Magic: A deep "Midnight Moss" gradient */
            background: radial-gradient(
                circle at center, 
                #1a1d1a 0%,   /* Subtle dark forest green hint */
                #ad753c 60%,  /* Transitioning to near-black */
                #000000 100%  /* Pure black at the extreme corners */
            );
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
            margin-top: 50px;
        }

        /* The Track now stays perfectly still */
        .carousel-track {
            position: absolute;
            top: 15%; 
            width: var(--card-w);
            height: var(--card-h);
            transform-style: preserve-3d;
        }

        .card {
            position: absolute;
            inset: 0;
            border-radius: 30px;
            background-size: cover;
            background-position: center;
            /* Cards rotate around the center of the circle below them */
            transform-origin: 50% var(--radius);
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        filter 0.8s, scale 0.8s;
            filter: brightness(0.5);
            scale: 0.8;
        }

        .card.active {
            filter: brightness(1);
            scale: 1.1;
            z-index: 10;
        }

        /* UI Elements */
        .content {
            z-index: 20;
            text-align: center;
            max-width: 500px;
            margin-top: 120px;
        }

        .nav {
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .nav button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #fdfdfd;
            background: transparent;
            color: white;
            cursor: pointer;
        }
        h1,p,button{
            font-family: "Poppins", sans-serif;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="carousel-track" id="track"></div>

        <div class="content">
            <h1>Gather here</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sed saepe vel nobis animi. Accusantium earum libero minus consectetur excepturi sint.</p>
            <button style="padding: 12px 24px; border-radius: 20px; border:2px solid white; cursor:pointer; background: transparent; color:white;">Join Now</button>
        </div>

        <div class="nav">
            <button onclick="move(-1)">❮</button>
            <button onclick="move(1)">❯</button>
        </div>
    </div>

    <script>
        const track = document.getElementById('track');
        const imgUrls = [
            'https://i.pinimg.com/736x/1a/3a/5a/1a3a5a4aa505042bcf531eb8b1b204e7.jpg',
            'https://i.pinimg.com/736x/11/6e/98/116e9875f720a25a50c4aac456f50bdd.jpg',
            'https://i.pinimg.com/736x/f1/aa/78/f1aa78fa0a5e63c633915b5bb82fb836.jpg',
            'https://i.pinimg.com/736x/88/53/b0/8853b0d68a2e62c1053ea7a089794600.jpg',
            'https://i.pinimg.com/736x/37/5f/97/375f977b344a6cc3ef7a16e9621e3b4d.jpg',
            'https://i.pinimg.com/1200x/75/1f/4b/751f4b56cc5edcc68119b0ee6af50014.jpg',
            'https://i.pinimg.com/736x/b8/2a/d1/b82ad1c3f653eec4f70bd080ef36d7f0.jpg'
        ];

        let currentIndex = Math.floor(imgUrls.length / 2);
        const angleStep = 22; // Distance between cards in degrees

        // Initialize Cards
        imgUrls.forEach((url, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.backgroundImage = `url(${url})`;
            track.appendChild(card);
        });

        const cards = document.querySelectorAll('.card');

        function updateCards() {
            cards.forEach((card, i) => {
                // Calculate the rotation for THIS card based on the current center index
                const cardRotation = (i - currentIndex) * angleStep;
                
                card.style.transform = `rotate(${cardRotation}deg)`;
                
                // Toggle active classes
                if (i === currentIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }

        function move(dir) {
            const newIndex = currentIndex + dir;
            if (newIndex >= 0 && newIndex < imgUrls.length) {
                currentIndex = newIndex;
                updateCards();
            }
        }

        // Run on load
        updateCards();

        // Mouse Wheel
        let lastScroll = 0;
        window.addEventListener('wheel', (e) => {
            if (Date.now() - lastScroll < 600) return;
            lastScroll = Date.now();
            move(e.deltaY > 0 ? 1 : -1);
        });
    </script>
</body>
</html>
